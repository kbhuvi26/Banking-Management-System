# ===================== Server =====================
server.port=8080

# ===================== MySQL / JDBC =====================
# Change the username/password below to match your local MySQL setup.
# The database "banking_management_system" must already exist -
# run database/schema.sql in MySQL Workbench (or CLI) first.
spring.datasource.url=jdbc:mysql://localhost:3306/banking_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# We are using plain JDBC (JdbcTemplate), NOT JPA/Hibernate, so no
# spring.jpa.* properties are needed here.

# ===================== Logging =====================
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.bms=DEBUG
