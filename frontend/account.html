<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounts · Ledgerly Bank</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Ledger<span>ly</span></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="account.html" class="active">Accounts</a>
      <a href="transactions.html">Transactions</a>
    </nav>
    <div class="user-chip">
      <strong id="sidebarName">—</strong>
      <span id="sidebarEmail">—</span>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Accounts &amp; profile</h1>
      <p class="sub">Manage your bank accounts and personal details.</p>
    </div>

    <div class="alert" id="pageAlert"></div>

    <!-- Profile panel -->
    <div class="panel">
      <h2>Your profile</h2>
      <p class="panel-sub">These details are stored in the <span class="mono">users</span> table.</p>
      <form id="profileForm">
        <div class="form-inline">
          <div class="field">
            <label for="profName">Full name</label>
            <input type="text" id="profName" required />
          </div>
          <div class="field">
            <label for="profEmail">Email</label>
            <input type="email" id="profEmail" required />
          </div>
        </div>
        <div class="form-inline">
          <div class="field">
            <label for="profPhone">Phone number</label>
            <input type="tel" id="profPhone" required />
          </div>
          <div class="field">
            <label for="profUsername">Username (fixed)</label>
            <input type="text" id="profUsername" disabled />
          </div>
        </div>
        <div class="table-actions">
          <button type="submit" class="btn btn-teal" style="width:auto;">Save changes</button>
          <button type="button" class="btn btn-danger" style="width:auto;" id="deleteAccountBtn">Delete my profile</button>
        </div>
      </form>
    </div>

    <!-- Accounts panel -->
    <div class="panel">
      <div class="toolbar">
        <div>
          <h2 style="margin-bottom:4px;">Your bank accounts</h2>
          <p class="panel-sub" style="margin-bottom:0;">Open a new account or manage an existing one.</p>
        </div>
        <button class="btn btn-primary" style="width:auto;" id="openCreateModal">+ New account</button>
      </div>
      <div class="grid-2" id="accountsGrid">
        <p class="loading-text">Loading accounts…</p>
      </div>
    </div>
  </main>
</div>

<!-- Create account modal -->
<div class="modal-backdrop" id="createModalBackdrop">
  <div class="modal">
    <h3>Open a new account</h3>
    <div class="alert" id="createAlert"></div>
    <form id="createAccountForm">
      <div class="field">
        <label for="newAccountType">Account type</label>
        <select id="newAccountType" required>
          <option value="SAVINGS">Savings</option>
          <option value="CURRENT">Current</option>
        </select>
      </div>
      <div class="field">
        <label for="initialDeposit">Initial deposit (₹)</label>
        <input type="number" id="initialDeposit" min="0" step="0.01" value="0" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelCreate">Cancel</button>
        <button type="submit" class="btn btn-primary">Create account</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit account type modal -->
<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal">
    <h3>Update account</h3>
    <div class="alert" id="editAlert"></div>
    <form id="editAccountForm">
      <input type="hidden" id="editAccountId" />
      <div class="field">
        <label for="editAccountType">Account type</label>
        <select id="editAccountType" required>
          <option value="SAVINGS">Savings</option>
          <option value="CURRENT">Current</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelEdit">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/account.js"></script>
</body>
</html>
