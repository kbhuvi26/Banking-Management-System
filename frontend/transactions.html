<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions · Ledgerly Bank</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Ledger<span>ly</span></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="account.html">Accounts</a>
      <a href="transactions.html" class="active">Transactions</a>
    </nav>
    <div class="user-chip">
      <strong id="sidebarName">—</strong>
      <span id="sidebarEmail">—</span>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Transactions</h1>
      <p class="sub">Move money and review your history.</p>
    </div>

    <div class="panel">
      <div class="field" style="max-width:340px;">
        <label for="accountSelect">Account</label>
        <select id="accountSelect"></select>
      </div>

      <div class="tabs">
        <button data-tab="deposit" class="active">Deposit</button>
        <button data-tab="withdraw">Withdraw</button>
        <button data-tab="transfer">Transfer</button>
      </div>

      <div class="alert" id="txnAlert"></div>

      <form id="depositForm" class="txn-form">
        <div class="form-inline">
          <div class="field">
            <label for="depositAmount">Amount (₹)</label>
            <input type="number" id="depositAmount" min="0.01" step="0.01" required />
          </div>
          <div class="field">
            <label for="depositDesc">Note (optional)</label>
            <input type="text" id="depositDesc" placeholder="e.g. Salary" />
          </div>
        </div>
        <button type="submit" class="btn btn-teal" style="width:auto;">Deposit</button>
      </form>

      <form id="withdrawForm" class="txn-form" style="display:none;">
        <div class="form-inline">
          <div class="field">
            <label for="withdrawAmount">Amount (₹)</label>
            <input type="number" id="withdrawAmount" min="0.01" step="0.01" required />
          </div>
          <div class="field">
            <label for="withdrawDesc">Note (optional)</label>
            <input type="text" id="withdrawDesc" placeholder="e.g. ATM withdrawal" />
          </div>
        </div>
        <button type="submit" class="btn btn-danger" style="width:auto;background:var(--red);color:#fff;">Withdraw</button>
      </form>

      <form id="transferForm" class="txn-form" style="display:none;">
        <div class="form-inline">
          <div class="field">
            <label for="toAccountNumber">Recipient account number</label>
            <input type="text" id="toAccountNumber" required />
          </div>
          <div class="field">
            <label for="transferAmount">Amount (₹)</label>
            <input type="number" id="transferAmount" min="0.01" step="0.01" required />
          </div>
        </div>
        <div class="field">
          <label for="transferDesc">Note (optional)</label>
          <input type="text" id="transferDesc" placeholder="e.g. Rent" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:auto;">Transfer</button>
      </form>
    </div>

    <div class="panel">
      <h2>Transaction history</h2>
      <p class="panel-sub" id="historySub">Full history for the selected account.</p>
      <div class="ledger" id="historyLedger">
        <p class="loading-text">Loading…</p>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
